services:
  backend:
    build:
      context: ./intranet-backend
      dockerfile: Dockerfile
    container_name: intranet-backend-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./intranet-backend/.env_pruebas
    environment:
      TZ: America/Bogota
      SPRING_PROFILES_ACTIVE: dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - backend-uploads-dev:/app/uploads
      - backend-logs-dev:/app/logs
    depends_on:
      minio:
        condition: service_healthy
        required: false
    networks:
      - intranet-network

  minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: intranet-minio-dev
    profiles: [minio]
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      TZ: America/Bogota
    volumes:
      - minio-data-dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - intranet-network

  frontend:
    build:
      context: ./Corporate-Intranet-Portal
      dockerfile: Dockerfile
    container_name: intranet-frontend-dev
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - intranet-network

volumes:
  backend-uploads-dev:
  backend-logs-dev:
  minio-data-dev:

networks:
  intranet-network:
    driver: bridge