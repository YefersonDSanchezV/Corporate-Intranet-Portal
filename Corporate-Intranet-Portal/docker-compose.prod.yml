version: '3.8'

services:
  intranet-portal:
    image: asisingenieria/corporate-intranet-portal:${TAG:-latest}
    container_name: intranet-portal-prod
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s