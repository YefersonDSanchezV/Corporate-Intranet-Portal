# docker-compose.yml — Stack unificado Intranet Institucional
# Uso:
#   Desarrollo / pruebas:  docker compose --env-file intranet-backend/.env_pruebas up --build
#   Producción:            docker compose --env-file intranet-backend/.env up --build
#   También funcionan docker-compose.dev.yml y docker-compose.prod.yml por separado.
version: "3.9"
services:
  backend:
    build:
      context: ./intranet-backend
      dockerfile: Dockerfile
    container_name: intranet-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - ./intranet-backend/.env
    environment:
      TZ: America/Bogota
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    networks:
      - intranet-network

  frontend:
    build:
      context: ./Corporate-Intranet-Portal
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: intranet-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - intranet-network

volumes:
  backend-uploads:
    driver: local
  backend-logs:
    driver: local

networks:
  intranet-network:
    driver: bridge
