# docker-compose.yml — Stack unificado Intranet Institucional
# Uso:
#   Desarrollo / pruebas:  docker compose --env-file intranet-backend/.env_pruebas up --build
#   Producción:            docker compose --env-file intranet-backend/.env up --build
#   También funcionan docker-compose.dev.yml y docker-compose.prod.yml por separado.
version: "3.9"
services:
  backend:
    build:
      context: ./intranet-backend
      dockerfile: Dockerfile
    container_name: intranet-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - ./intranet-backend/.env
    environment:
      TZ: America/Bogota
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      minio:
        condition: service_healthy
        required: false
    networks:
      - intranet-network

  minio:
    image: minio/minio:latest
    container_name: intranet-minio
    profiles: [minio]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: America/Bogota
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - intranet-network

  frontend:
    build:
      context: ./Corporate-Intranet-Portal
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: intranet-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - intranet-network

volumes:
  backend-uploads:
    driver: local
  backend-logs:
    driver: local
  minio-data:
    driver: local

networks:
  intranet-network:
    driver: bridge
