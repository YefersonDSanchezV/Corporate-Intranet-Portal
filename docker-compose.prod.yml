version: "3.9"
services:
  backend:
    build:
      context: ./intranet-backend
      dockerfile: Dockerfile
    container_name: intranet-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./intranet-backend/.env
    environment:
      TZ: America/Bogota
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    networks:
      - intranet-network

  frontend:
    build:
      context: ./Corporate-Intranet-Portal
      dockerfile: Dockerfile
    container_name: intranet-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - intranet-network

volumes:
  backend-uploads:
  backend-logs:

networks:
  intranet-network:
    driver: bridge
