version: "3.9"
services:
  backend:
    build:
      context: ./intranet-backend
      dockerfile: Dockerfile
    container_name: intranet-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./intranet-backend/.env
    environment:
      TZ: America/Bogota
      SPRING_PROFILES_ACTIVE: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    depends_on:
      minio:
        condition: service_healthy
        required: false
    networks:
      - intranet-network

  minio:
    image: minio/minio:latest
    container_name: intranet-minio
    profiles: [minio]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: America/Bogota
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - intranet-network

  frontend:
    build:
      context: ./Corporate-Intranet-Portal
      dockerfile: Dockerfile
    container_name: intranet-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - intranet-network

volumes:
  backend-uploads:
  backend-logs:
  minio-data:

networks:
  intranet-network:
    driver: bridge
