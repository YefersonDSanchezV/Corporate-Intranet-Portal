version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: intranet-backend

    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      TZ: America/Bogota
      
    networks:
      - intranet-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  intranet-network:
    driver: bridge